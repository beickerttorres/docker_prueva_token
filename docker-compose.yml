services:
  nginx:
    image: nginx:alpine
    container_name: proxy-nginx
    ports:
     - "80:80"
    volumes:
     - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
     - app
    networks:
    - red-cba
  db:
    image: mysql:8.0
    container_name: db_produccion
    restart: always
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - red-cba

  app:
    image: beickert/mi-app:v1
    container_name: app_produccion
    restart: always
    depends_on:
      - db
    ports:
      - "5051:5051"
    networks:
      - red-cba

networks:
  red-cba:
   name: red-cba

volumes:
  db_data:
    name: db_data
